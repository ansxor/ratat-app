services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ratat
      POSTGRES_PASSWORD: ratat
      POSTGRES_DB: ratat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${RATAT_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratat -d ratat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
