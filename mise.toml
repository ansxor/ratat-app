#:schema https://mise.jdx.dev/schema/mise.json

[tools]
just = "latest"

[env]
_.file = { path = ".ratat.env", optional = true }

RATAT_PORT_BASE = "{{ env.RATAT_PORT_BASE | default(value=20000 + (config_root | hash(len=4) | int(base=16) % 500) * 20) }}"

COMPOSE_PROJECT_NAME = "{{ env.COMPOSE_PROJECT_NAME | default(value='ratat-app-' ~ (config_root | hash(len=8))) }}"

RATAT_WEB_PORT = "{{ env.RATAT_PORT_BASE | int + 0 }}"
RATAT_API_PORT = "{{ env.RATAT_PORT_BASE | int + 1 }}"
RATAT_POSTGRES_PORT = "{{ env.RATAT_PORT_BASE | int + 2 }}"

DATABASE_URL = "postgres://ratat:ratat@localhost:{{ env.RATAT_PORT_BASE | int + 2 }}/ratat"

BSKY_APPVIEW_URL = "https://public.api.bsky.app"
PLC_DIRECTORY_URL = "https://plc.directory"
JETSTREAM_URL = "wss://jetstream1.us-east.bsky.network"

VITE_RATAT_APPVIEW_URL = "http://127.0.0.1:{{ env.RATAT_PORT_BASE | int + 1 }}"
VITE_ATPROTO_HANDLE_RESOLVER_URL = "https://public.api.bsky.app"
VITE_ATPROTO_PLC_URL = "https://plc.directory"
